<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Tưới Cây Tự Động - Smart Farm</title>
    <!-- Thư viện Paho MQTT cho Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .role-badge {
            display: flex;
            gap: 6px;
        }

        .btn-role {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-role.active {
            background-color: var(--accent-blue);
            color: #0f172a;
        }

        /* Status Bar */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.disconnected {
            background-color: var(--accent-red);
        }

        /* Sensor Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .card.full-width {
            grid-column: span 2;
        }

        .card .label {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .card .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 6px;
        }

        /* Control Sections (Ẩn hiện theo phân quyền) */
        .admin-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }

        .btn-on { background-color: var(--accent-green); }
        .btn-off { background-color: var(--accent-red); }

        /* Modal Đăng nhập Admin */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label { font-size: 13px; color: var(--text-sub); }
        .form-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-save {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-close {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌱 TRẠM TƯỚI CÂY</h1>
            <div class="role-badge">
                <button class="btn-role active" id="btn-guest" onclick="switchRole('guest')">Guest</button>
                <button class="btn-role" id="btn-admin" onclick="checkAdminPassword()">Admin</button>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span>Trạng thái kết nối:</span>
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Đang kết nối...</span>
            </div>
        </div>

        <!-- Sensor Grid (Cả Guest và Admin đều xem được) -->
        <div class="grid">
            <div class="card">
                <div class="label">Nhiệt độ</div>
                <div class="value"><span id="temp">--</span> °C</div>
            </div>

            <div class="card">
                <div class="label">Độ ẩm đất</div>
                <div class="value"><span id="soil">--</span> %</div>
            </div>

            <div class="card full-width">
                <div class="label">Mức nước bồn</div>
                <div class="value"><span id="water">--</span> %</div>
            </div>
        </div>

        <!-- Pump Controls (Chỉ hiện khi đăng nhập quyền ADMIN) -->
        <div class="admin-section" id="admin-controls" style="display: none;">
            <div class="section-title">💧 ĐIỀU KHIỂN BƠM 1 (Bơm bồn nước)</div>
            <div class="btn-group">
                <button class="btn-action btn-on" onclick="controlPump('luan.pump1', '1')">BẬT BƠM 1</button>
                <button class="btn-action btn-off" onclick="controlPump('luan.pump1', '0')">TẮT BƠM 1</button>
            </div>

            <div class="section-title" style="margin-top: 4px;">🌿 ĐIỀU KHIỂN BƠM 2 (Bơm tưới cây)</div>
            <div class="btn-group">
                <button class="btn-action btn-on" onclick="controlPump('luan.pump2', '1')">BẬT BƠM 2</button>
                <button class="btn-action btn-off" onclick="controlPump('luan.pump2', '0')">TẮT BƠM 2</button>
            </div>
        </div>
    </div>

    <!-- Modal Nhập Mật khẩu Admin -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-blue);">🔐 Đăng nhập Quản trị viên</h3>
            <div class="form-group">
                <label for="admin-pass">Mật khẩu Admin:</label>
                <input type="password" id="admin-pass" placeholder="Nhập mật khẩu (mặc định: 123456)">
            </div>
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeLoginModal()">Hủy</button>
                <button class="btn-save" onclick="verifyAdmin()">Xác nhận</button>
            </div>
        </div>
    </div>

    <script>
        let client = null;
        // Tài khoản Adafruit IO cấu hình cứng ngầm định cho hệ thống
        const USERNAME = "ZenoAdmin";
        const AIO_KEY = "aio_BbwJ20Zr62Y79F3Avcjg4YaKh3Fw";
        
        // Mật khẩu Admin đơn giản (Bạn có thể đổi tùy ý bên dưới)
        const ADMIN_PASSWORD = "123456"; 
        let currentRole = 'guest';

        window.onload = function() {
            connectMQTT();
        };

        function connectMQTT() {
            updateStatus('connecting', 'Đang kết nối...');
            const clientId = 'web_client_' + Math.random().toString(16).substr(2, 8);
            
            client = new Paho.MQTT.Client('io.adafruit.com', 443, clientId);

            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                userName: USERNAME,
                password: AIO_KEY,
                useSSL: true
            });
        }

        function onConnect() {
            updateStatus('connected', 'Đã kết nối');
            // Đăng ký nhận dữ liệu từ feed tổng hợp
            client.subscribe(USERNAME + '/feeds/system-data');
        }

        function onFailure(responseObject) {
            updateStatus('disconnected', 'Lỗi kết nối');
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                updateStatus('disconnected', 'Mất kết nối');
            }
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            if (topic.endsWith('system-data')) {
                try {
                    const data = JSON.parse(payload);
                    if (data.temp !== undefined) document.getElementById('temp').innerText = data.temp;
                    if (data.soil !== undefined) document.getElementById('soil').innerText = data.soil;
                    if (data.water !== undefined) document.getElementById('water').innerText = data.water;
                } catch (e) {
                    console.error("Lỗi parse JSON:", e);
                }
            }
        }

        function controlPump(feedKey, command) {
            if (currentRole !== 'admin') {
                alert("Bạn cần đăng nhập quyền Admin để điều khiển thiết bị!");
                return;
            }
            if (!client || !client.isConnected()) {
                alert("Chưa kết nối tới Adafruit IO!");
                return;
            }

            const topicPath = USERNAME + '/feeds/' + feedKey;
            const message = new Paho.MQTT.Message(command);
            message.destinationName = topicPath;
            client.send(message);
        }

        // Chuyển đổi qua lại giữa Guest và Admin
        function switchRole(role) {
            currentRole = role;
            document.getElementById('btn-guest').className = 'btn-role ' + (role === 'guest' ? 'active' : '');
            document.getElementById('btn-admin').className = 'btn-role ' + (role === 'admin' ? 'active' : '');
            
            const adminSection = document.getElementById('admin-controls');
            if (role === 'admin') {
                adminSection.style.display = 'flex';
            } else {
                adminSection.style.display = 'none';
            }
        }

        function checkAdminPassword() {
            if (currentRole === 'admin') return; // Đang ở admin rồi thì thôi
            document.getElementById('admin-pass').value = '';
            document.getElementById('login-modal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        function verifyAdmin() {
            const inputPass = document.getElementById('admin-pass').value;
            if (inputPass === ADMIN_PASSWORD) {
                closeLoginModal();
                switchRole('admin');
                alert("🔓 Đăng nhập quyền Admin thành công!");
            } else {
                alert("❌ Mật khẩu không chính xác!");
            }
        }

        function updateStatus(state, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            dot.className = 'status-dot ' + (state === 'connected' ? 'connected' : 'disconnected');
            statusText.innerText = text;
        }
    </script>
</body>
</html>
