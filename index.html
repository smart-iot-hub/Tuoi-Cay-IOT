<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Tưới Cây Tự Động</title>
    <!-- Nhúng thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1e29; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #262c3d; padding: 20px; border-radius: 12px; }
        .header { text-align: center; margin-bottom: 20px; }
        .status { text-align: right; font-weight: bold; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #1e2330; padding: 15px; border-radius: 8px; text-align: center; }
        .value { font-size: 24px; font-weight: bold; color: #00d2d3; margin-top: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-on { background-color: #10ac84; color: white; }
        .btn-off { background-color: #ee5253; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🌱 TRẠM TƯỚI CÂY TỰ ĐỘNG</h2>
    </div>

    <div class="status">
        Trạng thái: <span id="status-text" style="color: #ff4757;">🔴 Mất kết nối</span>
    </div>

    <div class="grid">
        <div class="card">NHIỆT ĐỘ<div class="value" id="temp">-- °C</div></div>
        <div class="card">ĐỘ ẨM KHÍ<div class="value" id="humi">-- %</div></div>
        <div class="card">ĐỘ ẨM ĐẤT<div class="value" id="soil">-- %</div></div>
        <div class="card">MỨC NƯỚC BỒN<div class="value" id="water">-- %</div></div>
    </div>

    <div class="btn-group">
        <button class="btn-on" onclick="sendControl('ON')">BẬT BƠM</button>
        <button class="btn-off" onclick="sendControl('OFF')">TẮT BƠM</button>
    </div>
</div>

<script>
    // 1. Cấu hình MQTT WSS (Bắt buộc dùng cổng 8884 trên GitHub Pages)
    const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt';
    
    // Tạo Client ID ngẫu nhiên để tránh đụng độ ID gây ra lỗi 101
    const clientId = 'web_user_' + Math.random().toString(16).substring(2, 8);
    const TOPIC_DATA = 'tuoicay/sensors';
    const TOPIC_PUMP = 'tuoicay/pump';

    const client = mqtt.connect(BROKER_URL, {
        clientId: clientId,
        clean: true,
        reconnectPeriod: 2000
    });

    // 2. Xử lý sự kiện kết nối
    client.on('connect', () => {
        document.getElementById('status-text').innerHTML = '<span style="color: #2ed573;">🟢 Đã kết nối</span>';
        client.subscribe(TOPIC_DATA);
    });

    client.on('offline', () => {
        document.getElementById('status-text').innerHTML = '<span style="color: #ff4757;">🔴 Mất kết nối</span>';
    });

    // 3. Lắng nghe dữ liệu gửi từ ESP32
    client.on('message', (topic, message) => {
        if (topic === TOPIC_DATA) {
            try {
                const data = JSON.parse(message.toString());
                if (data.temp !== undefined) document.getElementById('temp').innerText = data.temp + ' °C';
                if (data.humi !== undefined) document.getElementById('humi').innerText = data.humi + ' %';
                if (data.soil !== undefined) document.getElementById('soil').innerText = data.soil + ' %';
                if (data.water !== undefined) document.getElementById('water').innerText = data.water + ' %';
            } catch (e) {
                console.error("Lỗi định dạng JSON:", e);
            }
        }
    });

    // 4. Hàm điều khiển Bơm
    function sendControl(cmd) {
        if (client.connected) {
            client.publish(TOPIC_PUMP, cmd);
        }
    }
</script>

</body>
</html>
