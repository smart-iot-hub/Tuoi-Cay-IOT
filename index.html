<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Tưới Cây Tự Động</title>
    <!-- Thư viện Paho MQTT cho Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-config {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Status Bar */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.disconnected {
            background-color: var(--accent-red);
        }

        /* Sensor Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .card.full-width {
            grid-column: span 2;
        }

        .card .label {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .card .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 6px;
        }

        /* Control Sections */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }

        .btn-on { background-color: var(--accent-green); }
        .btn-off { background-color: var(--accent-red); }

        /* Modal Cấu hình */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label { font-size: 13px; color: var(--text-sub); }
        .form-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-save {
            background-color: var(--accent-blue);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-close {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌱 TRẠM TƯỚI CÂY TỰ ĐỘNG</h1>
            <button class="btn-config" onclick="openConfigModal()">⚙️ Cấu hình</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span>Máy chủ Adafruit IO:</span>
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Đang kết nối...</span>
            </div>
        </div>

        <!-- Sensor Grid -->
        <div class="grid">
            <div class="card">
                <div class="label">Nhiệt độ</div>
                <div class="value"><span id="temp">--</span> °C</div>
            </div>

            <div class="card">
                <div class="label">Độ ẩm đất</div>
                <div class="value"><span id="soil">--</span> %</div>
            </div>

            <div class="card full-width">
                <div class="label">Mức nước bồn</div>
                <div class="value"><span id="water">--</span> %</div>
            </div>
        </div>

        <!-- Pump Controls -->
        <div class="section-title">💧 BƠM 1 (Bơm bồn nước)</div>
        <div class="btn-group">
            <button class="btn-action btn-on" onclick="controlPump('luan.pump1', '1')">BẬT BƠM 1</button>
            <button class="btn-action btn-off" onclick="controlPump('luan.pump1', '0')">TẮT BƠM 1</button>
        </div>

        <div class="section-title">🌿 BƠM 2 (Bơm tưới cây)</div>
        <div class="btn-group">
            <button class="btn-action btn-on" onclick="controlPump('luan.pump2', '1')">BẬT BƠM 2</button>
            <button class="btn-action btn-off" onclick="controlPump('luan.pump2', '0')">TẮT BƠM 2</button>
        </div>
    </div>

    <!-- Modal Cấu hình -->
    <div class="modal" id="config-modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-blue);">Cấu hình Adafruit IO</h3>
            <div class="form-group">
                <label for="input-user">Adafruit IO Username:</label>
                <input type="text" id="input-user" placeholder="Nhập Username...">
            </div>
            <div class="form-group">
                <label for="input-key">Adafruit IO Key (AIO Key):</label>
                <input type="password" id="input-key" placeholder="Nhập chuỗi aio_...">
            </div>
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeConfigModal()">Hủy</button>
                <button class="btn-save" onclick="saveConfig()">Lưu & Kết nối</button>
            </div>
        </div>
    </div>

    <script>
        let client = null;
        let USERNAME = localStorage.getItem('aio_username') || 'ZenoAdmin';
        let AIO_KEY = localStorage.getItem('aio_key') || 'aio_BbwJ20Zr62Y79F3Avcjg4YaKh3Fw';

        window.onload = function() {
            if (!USERNAME || !AIO_KEY) {
                openConfigModal();
            } else {
                connectMQTT();
            }
        };

        function connectMQTT() {
            if (!USERNAME || !AIO_KEY) return;

            updateStatus('connecting', 'Đang kết nối...');
            const clientId = 'web_client_' + Math.random().toString(16).substr(2, 8);
            
            client = new Paho.MQTT.Client('io.adafruit.com', 443, clientId);

            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                userName: USERNAME,
                password: AIO_KEY,
                useSSL: true
            });
        }

        // 1. Hàm chạy ngay khi kết nối MQTT thành công
        function onConnect() {
            console.log("🟢 MQTT Connected!");
            updateStatus('connected', 'Đã kết nối');
            
            // Subscribe vào feed chứa gói JSON tổng hợp
            client.subscribe(USERNAME + '/feeds/system-data');

            console.log("📡 Đã Subscribe thành công feed system-data!");
        }

        function onFailure(responseObject) {
            console.error("🔴 Kết nối thất bại:", responseObject.errorMessage);
            updateStatus('disconnected', 'Lỗi kết nối');
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.warn("⚠️ Mất kết nối MQTT:", responseObject.errorMessage);
                updateStatus('disconnected', 'Mất kết nối');
            }
        }

        // 2. Hàm tự động kích hoạt khi có gói JSON gửi về từ ESP32
        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            console.log("📩 Nhận dữ liệu JSON:", topic, "=>", payload);

            if (topic.endsWith('system-data')) {
                try {
                    // Giải mã chuỗi JSON thành các biến riêng biệt
                    const data = JSON.parse(payload);

                    // Cập nhật lên giao diện HTML tương ứng
                    if (data.temp !== undefined) {
                        document.getElementById('temp').innerText = data.temp;
                    }
                    if (data.soil !== undefined) {
                        document.getElementById('soil').innerText = data.soil;
                    }
                    if (data.water !== undefined) {
                        document.getElementById('water').innerText = data.water;
                    }
                } catch (e) {
                    console.error("🔴 Lỗi giải mã JSON:", e);
                }
            }
        }

        function controlPump(feedKey, command) {
            if (!client || !client.isConnected()) {
                alert("Chưa kết nối tới Adafruit IO! Vui lòng kiểm tra lại cấu hình.");
                return;
            }

            const topicPath = USERNAME + '/feeds/' + feedKey;
            const message = new Paho.MQTT.Message(command);
            message.destinationName = topicPath;
            
            client.send(message);
            console.log("📤 Đã gửi lệnh điều khiển:", topicPath, "=>", command);
        }

        function updateStatus(state, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            dot.className = 'status-dot ' + (state === 'connected' ? 'connected' : 'disconnected');
            statusText.innerText = text;
        }

        function openConfigModal() {
            document.getElementById('input-user').value = USERNAME;
            document.getElementById('input-key').value = AIO_KEY;
            document.getElementById('config-modal').style.display = 'flex';
        }

        function closeConfigModal() {
            document.getElementById('config-modal').style.display = 'none';
        }

        function saveConfig() {
            const user = document.getElementById('input-user').value.trim();
            const key = document.getElementById('input-key').value.trim();

            if (!user || !key) {
                alert("Vui lòng nhập đầy đủ Username và AIO Key!");
                return;
            }

            localStorage.setItem('aio_username', user);
            localStorage.setItem('aio_key', key);
            
            USERNAME = user;
            AIO_KEY = key;

            closeConfigModal();

            if (client && client.isConnected()) {
                client.disconnect();
            }
            connectMQTT();
        }
    </script>
</body>
</html>
