<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Tưới Cây Tự Động - Smart IoT Hub</title>
    <!-- Thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h2 { margin: 0; font-size: 20px; color: var(--accent-blue); }
        .btn-config {
            background: #334155;
            color: var(--text-main);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .card.full-width { grid-column: span 2; }
        .label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }
        .value { font-size: 26px; font-weight: 700; color: var(--accent-blue); margin-top: 6px; }

        .section-title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }

        button.cmd-btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-on { background: var(--accent-green); color: #000; }
        .btn-off { background: var(--accent-red); color: #fff; }
        button.cmd-btn:hover { opacity: 0.85; transform: translateY(-1px); }

        /* Modal Cấu hình Key */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 14px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🌱 TRẠM TƯỚI CÂY TỰ ĐỘNG</h2>
        <button class="btn-config" onclick="openConfig()">⚙️ Cấu hình</button>
    </div>

    <div class="status-bar">
        <span>Máy chủ Adafruit IO:</span>
        <span id="status-text" style="color: var(--accent-red); font-weight: bold;">🔴 Mất kết nối</span>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">Nhiệt độ</div>
            <div class="value" id="temp">-- °C</div>
        </div>
        <div class="card">
            <div class="label">Độ ẩm đất</div>
            <div class="value" id="soil">-- %</div>
        </div>
        <div class="card full-width">
            <div class="label">Mức nước bồn</div>
            <div class="value" id="water">-- %</div>
        </div>
    </div>

    <div class="section-title">💧 BƠM 1 (Bơm bồn nước)</div>
    <div class="btn-group">
        <button class="cmd-btn btn-on" onclick="controlPump(FEED_PUMP1, 'ON')">BẬT BƠM 1</button>
        <button class="cmd-btn btn-off" onclick="controlPump(FEED_PUMP1, 'OFF')">TẮT BƠM 1</button>
    </div>

    <div class="section-title">🌿 BƠM 2 (Bơm tưới cây)</div>
    <div class="btn-group">
        <button class="cmd-btn btn-on" onclick="controlPump(FEED_PUMP2, 'ON')">BẬT BƠM 2</button>
        <button class="cmd-btn btn-off" onclick="controlPump(FEED_PUMP2, 'OFF')">TẮT BƠM 2</button>
    </div>
</div>

<!-- Modal Cấu Hình Mật Khẩu API -->
<div class="modal" id="config-modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">🔑 Cấu hình Adafruit IO</h3>
        <label class="label">Username Adafruit</label>
        <input type="text" id="input-user" placeholder="Ví dụ: ZenoAdmin">
        
        <label class="label">AIO Key (Mật khẩu API)</label>
        <input type="password" id="input-key" placeholder="Nhập chuỗi aio_...">
        
        <button class="cmd-btn btn-on" style="width:100%;" onclick="saveConfig()">LƯU VÀ KẾT NỐI</button>
    </div>
</div>

<script>
    const BROKER_URL = 'wss://io.adafruit.com:443/mqtt';
    
    // Đọc thông số cấu hình đã lưu trong Trình duyệt
    let USERNAME = localStorage.getItem('aio_username') || 'ZenoAdmin';
    let AIO_KEY  = localStorage.getItem('aio_key') || '';

    let FEED_TEMP, FEED_SOIL, FEED_WATER, FEED_PUMP1, FEED_PUMP2;
    let client = null;

    function initFeeds() {
        FEED_TEMP  = USERNAME + '/feeds/luan.temperature';
        FEED_SOIL  = USERNAME + '/feeds/luan.soil';
        FEED_WATER = USERNAME + '/feeds/luan.water';
        FEED_PUMP1 = USERNAME + '/feeds/luan.pump1';
        FEED_PUMP2 = USERNAME + '/feeds/luan.pump2';
    }

    function connectMQTT() {
        if (!AIO_KEY) {
            document.getElementById('status-text').innerHTML = '<span style="color: #f59e0b;">🟡 Chưa có Key</span>';
            openConfig();
            return;
        }

        initFeeds();
        const clientId = 'web_user_' + Math.random().toString(16).substring(2, 8);

        if (client) client.end();

        client = mqtt.connect(BROKER_URL, {
            clientId: clientId,
            username: USERNAME,
            password: AIO_KEY,
            clean: true,
            reconnectPeriod: 3000
        });

        client.on('connect', () => {
            document.getElementById('status-text').innerHTML = '<span style="color: var(--accent-green);">🟢 Đã kết nối</span>';
            client.subscribe(FEED_TEMP);
            client.subscribe(FEED_SOIL);
            client.subscribe(FEED_WATER);
        });

        client.on('offline', () => {
            document.getElementById('status-text').innerHTML = '<span style="color: var(--accent-red);">🔴 Mất kết nối</span>';
        });

        client.on('message', (topic, message) => {
            const val = message.toString();
            if (topic === FEED_TEMP)  document.getElementById('temp').innerText = val + ' °C';
            if (topic === FEED_SOIL)  document.getElementById('soil').innerText = val + ' %';
            if (topic === FEED_WATER) document.getElementById('water').innerText = val + ' %';
        });
    }

    function controlPump(feed, state) {
        if (client && client.connected) {
            client.publish(feed, state);
        } else {
            alert('Chưa kết nối đến Adafruit IO!');
        }
    }

    function openConfig() {
        document.getElementById('input-user').value = USERNAME;
        document.getElementById('input-key').value = AIO_KEY;
        document.getElementById('config-modal').style.display = 'flex';
    }

    function saveConfig() {
        USERNAME = document.getElementById('input-user').value.trim();
        AIO_KEY  = document.getElementById('input-key').value.trim();

        localStorage.setItem('aio_username', USERNAME);
        localStorage.setItem('aio_key', AIO_KEY);

        document.getElementById('config-modal').style.display = 'none';
        connectMQTT();
    }

    // Tự động kết nối khi vào web
    connectMQTT();
</script>

</body>
</html>
